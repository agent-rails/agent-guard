default: allow

# Companion to policy.example.yaml, for a different seam: not "should this tool
# call run" but "should this file-write content land on disk." Framed as a
# synthetic tool call — {"tool": "write", "args": {"content": ...}} — so the
# same deterministic, tested Policy engine evaluates both.
#
# IMPORTANT: evaluate with args={"content": ...} ONLY, never {"path": ...,
# "content": ...} together — Policy renders the whole args dict into one
# matched string, so including path would make a file merely NAMED
# "secrets.yaml" or "tokens.ts" deny regardless of content. Track path
# separately (e.g. in your own audit wrapper) if you need it recorded.
#
# First-match-wins over the combined rendered string means only one rule_id
# surfaces per write, even if content matches multiple allow-tier patterns —
# deny-safety is preserved (every deny rule is ordered before every allow
# rule, so no deny is ever masked), but this is not a multi-finding report
# the way ~/.claude/scripts/scan-skill.sh's per-line scan is.
#
# Patterns migrated from scan-skill.sh's general (non-frontmatter-structural)
# checks. NOT migrated, deliberately:
#   - YAML-frontmatter-aware checks (e.g. "hooks: directive inside
#     frontmatter") — don't translate to a flat regex-over-content model.
#   - Line-start harness-execution syntax ("^! ") — a YAML-frontmatter-aware,
#     per-line scan still doesn't reduce to a single first-match-wins deny
#     rule the way scan-skill.sh's line-by-line loop does, so this stays in
#     the script rather than the policy. (_render_args now preserves real
#     newlines, so a MULTILINE-anchored pattern is technically possible here
#     going forward — just not what motivated leaving this one out.)
#   - Bare network calls (curl/wget/fetch NOT piped to a shell) — was a LOW
#     scan-skill.sh finding; omitted here rather than added as noise.
# The credential/sensitive-path rule below is a literal word match, not a
# credential-shape detector — password=/api_key=/PRIVATE_KEY= slip through
# with no rule matching, same limitation scan-skill.sh already had.

rules:
  - id: pipe-to-shell
    decision: deny
    tools: ["write"]
    # [\s\S]*? (not .*): rendered args now preserve real newlines (see
    # _render_args), and a bare `.` never crosses them without DOTALL --
    # a shell line-continuation ("curl ... \<newline>| sh") is valid,
    # executable shell and must not evade this rule.
    arg_patterns: ["(curl|wget)\\s+[\\s\\S]*?\\|\\s*(sh|bash)"]
    reason: remote code execution — piping a fetch straight into a shell

  - id: eval-call
    decision: deny
    tools: ["write"]
    arg_patterns: ["\\beval\\s*\\("]
    reason: eval() call in written content

  - id: exec-call
    decision: deny
    tools: ["write"]
    arg_patterns: ["\\bexec\\s*\\("]
    reason: exec() call in written content

  - id: sensitive-path-reference
    decision: deny
    tools: ["write"]
    arg_patterns: ["(?i)(~/\\.ssh/|\\bcredentials\\b|\\btokens\\b|\\bsecrets\\b)"]
    reason: reference to sensitive paths or credential material (word match, not a credential-shape detector)

  - id: claude-md-reference
    decision: deny
    tools: ["write"]
    arg_patterns: ["(?i)(~/\\.claude/CLAUDE\\.md|CLAUDE\\.md)"]
    reason: reference to CLAUDE.md — memory-poisoning vector

  - id: symlink-creation
    decision: deny
    tools: ["write"]
    arg_patterns: ["\\bln\\s+-s\\b"]
    reason: symlink creation in written content

  - id: base64-blob
    decision: allow
    tools: ["write"]
    arg_patterns: ["[A-Za-z0-9+/]{50,}={0,2}"]
    reason: "logged, not blocked: possible base64-encoded payload — deny is too aggressive here (lockfile integrity hashes, minified assets are common legitimate matches); scan-skill.sh's HIGH severity was calibrated for skill-file instructions specifically, a narrower and riskier context"

  - id: destructive-git-reset
    decision: allow
    tools: ["write"]
    arg_patterns: ["git\\s+reset\\s+--hard"]
    reason: "logged, not blocked: destructive git operation referenced in written content"

  - id: destructive-rm
    decision: allow
    tools: ["write"]
    arg_patterns: ["\\brm\\s+-(rf|fr|f)\\b"]
    reason: "logged, not blocked: destructive file operation referenced in written content"

  - id: dotenv-reference
    decision: allow
    tools: ["write"]
    arg_patterns: ["(?i)\\.env\\b"]
    reason: "logged, not blocked: reference to a .env file"

  - id: permission-modification
    decision: allow
    tools: ["write"]
    arg_patterns: ["\\b(chmod|chown)\\b"]
    reason: "logged, not blocked: permission-modification command referenced in written content"
