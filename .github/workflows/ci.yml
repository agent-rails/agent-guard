name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python examples/end_to_end.py

  claude-code-hook:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Hook subprocess, install and report suites through the real shell
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_claude_code_hook_subprocess.py
          tests/test_claude_code_install.py
          tests/test_claude_code_hook.py
          tests/test_report.py

  gvisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pre-pull the isolation test image (before runsc touches docker)
        run: |
          set -euo pipefail
          for i in 1 2 3; do docker pull busybox:latest && break || { echo "pull attempt $i failed"; sleep 5; }; done
          docker image inspect busybox:latest >/dev/null
      - name: Install gVisor (runsc)
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
          wget -q "${URL}/gvisor.tar.zstd" "${URL}/gvisor.tar.zstd.sha512"
          sha512sum -c gvisor.tar.zstd.sha512
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          sudo runsc install
          sudo systemctl reload docker
      - run: pip install -e ".[dev]"
      - name: Verify runsc + docker are active (fail if not)
        run: |
          set -euo pipefail
          command -v runsc
          command -v docker
          docker info >/dev/null
      - name: Isolation tests under gVisor (must not vacuously skip)
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_gvisor_isolation.py -v | tee /tmp/gvisor.log
          if grep -qi "skipped" /tmp/gvisor.log; then
            echo "::error::gVisor isolation test skipped — runsc/docker not active; this job must exercise real isolation, not pass vacuously" >&2
            exit 1
          fi
